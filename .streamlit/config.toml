# 테마 설정 — 색상 값은 DESIGN.md 토큰 기준 (오리엔티어링 지도: 크림 종이, 잉크, 코스 보라)
# Streamlit 1.66 기준 옵션

[theme]
base = "light"

# Color
primaryColor = "#7B2CBF"              # course: 고른 칩, 버튼, 코스 선
backgroundColor = "#F7F3EA"           # paper: 메인 영역 배경
secondaryBackgroundColor = "#FFFFFF"  # sheet: 입력창, 위젯 배경
textColor = "#25232A"                 # ink: 기본 텍스트
linkColor = "#7B2CBF"                 # course
borderColor = "#25232A"               # ink: 입력창·칩 테두리
showWidgetBorder = true

# Table (st.dataframe)
dataframeBorderColor = "#E4DED2"            # rule
dataframeHeaderBackgroundColor = "#F7F3EA"  # paper
dataframeHeaderTextColor = "#625E69"        # sub

# Typography
font = "Pretendard:https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css"
headingFont = "Pretendard:https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css"
headingFontWeights = [800, 700, 700, 600, 600, 600]
metricValueFontWeight = 700

# Shape
baseRadius = "6px"     # radius-sm: 입력창, 칩
buttonRadius = "6px"   # radius-sm: 버튼

[theme.sidebar]
backgroundColor = "#F7F3EA"
secondaryBackgroundColor = "#FFFFFF"
