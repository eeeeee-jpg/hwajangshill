# 테마 설정 — 색상 값은 DESIGN.md 토큰 기준
# Streamlit 1.66 기준 옵션

[theme]
base = "light"

# Color
primaryColor = "#FF52A3"              # primary: 선택된 필터, 버튼, 슬라이더
backgroundColor = "#FFFFFF"           # white: 메인 영역 배경
secondaryBackgroundColor = "#F8F9FD"  # gray-50: 입력창, 위젯 배경
textColor = "#222222"                 # gray-800: 기본 텍스트
linkColor = "#FF52A3"                 # primary
borderColor = "#E2E4ED"               # gray-200: 기본 테두리
showWidgetBorder = true

# Table (st.dataframe)
dataframeBorderColor = "#F0F2F9"            # gray-100
dataframeHeaderBackgroundColor = "#F8F9FD"  # gray-50
dataframeHeaderTextColor = "#505462"        # gray-600

# Typography
font = "Pretendard:https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css"
headingFont = "Pretendard:https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css"
headingFontWeights = [700, 700, 700, 600, 600, 600]
metricValueFontWeight = 700

# Shape
baseRadius = "8px"     # radius-sm: 입력창, 체크박스
buttonRadius = "12px"  # radius-md: 버튼

[theme.sidebar]
backgroundColor = "#F8F9FD"           # gray-50: 사이드바를 메인과 구분
secondaryBackgroundColor = "#FFFFFF"  # 사이드바 안의 위젯은 흰색
